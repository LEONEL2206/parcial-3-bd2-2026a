<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <title>Taller Mecánico</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f4f6f9;
        }

        .navbar{
            box-shadow:0px 2px 10px rgba(0,0,0,.1);
        }

        .card{
            border:none;
            border-radius:15px;
            box-shadow:0px 2px 15px rgba(0,0,0,.1);
        }

        h2{
            font-weight:bold;
            color:#0d6efd;
        }

        .table{
            background:white;
        }

        footer{
            margin-top:40px;
            text-align:center;
            color:gray;
        }

    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand" href="/">
            🔧 Taller Mecánico
        </a>

        <div>

            <a class="btn btn-light btn-sm" href="/clientes">
                Clientes
            </a>

            <a class="btn btn-light btn-sm" href="/vehiculos">
                Vehículos
            </a>

            <a class="btn btn-light btn-sm" href="/mecanicos">
                Mecánicos
            </a>

            <a class="btn btn-light btn-sm" href="/repuestos">
                Repuestos
            </a>

            <a class="btn btn-light btn-sm" href="/ordenes">
                Órdenes
            </a>

        </div>

    </div>

</nav>

<div class="container mt-4">

    <div class="card p-4">

        {% block contenido %}
        {% endblock %}

    </div>

</div>

<footer>

    <p>
        Sistema de Gestión de Taller Mecánico © 2026
    </p>

</footer>

</body>
</html>

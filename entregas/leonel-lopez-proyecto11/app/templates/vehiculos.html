{% extends 'base.html' %}

{% block contenido %}

<h2>🚗 Gestión de Vehículos</h2>

<form method="POST">

    <input
        type="text"
        name="placa"
        class="form-control mb-2"
        placeholder="Placa"
        required>

    <input
        type="text"
        name="modelo"
        class="form-control mb-2"
        placeholder="Modelo">

    <input
        type="number"
        name="anio"
        class="form-control mb-2"
        placeholder="Año">

    <select
        name="cliente"
        class="form-control mb-2">

        {% for c in clientes %}
            <option value="{{ c[0] }}">
                {{ c[0] }} - {{ c[1] }}
            </option>
        {% endfor %}

    </select>

    <button class="btn btn-success">
        💾 Guardar
    </button>

</form>

<hr>

<table class="table table-striped table-hover table-bordered">

<tr>
    <th>ID</th>
    <th>Placa</th>
    <th>Modelo</th>
    <th>Año</th>
    <th>Cliente</th>
    <th>Acciones</th>
</tr>

{% for v in vehiculos %}
<tr>

    <td>{{ v[0] }}</td>
    <td>{{ v[1] }}</td>
    <td>{{ v[2] }}</td>
    <td>{{ v[3] }}</td>
    <td>{{ v[4] }}</td>

    <td>

        <a href="/editar_vehiculo/{{ v[0] }}"
           class="btn btn-warning btn-sm">
           Editar
        </a>

        <a href="/eliminar_vehiculo/{{ v[0] }}"
           class="btn btn-danger btn-sm"
           onclick="return confirm('¿Eliminar vehículo?')">
           Eliminar
        </a>

    </td>

</tr>
{% endfor %}

</table>

{% endblock %}

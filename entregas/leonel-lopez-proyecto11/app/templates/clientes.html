{% extends 'base.html' %}

{% block contenido %}

<h2>👤 Gestión de Clientes</h2>

<form method="POST">

    <input
        type="text"
        name="nombres"
        class="form-control mb-2"
        placeholder="Nombre"
        required>

    <input
        type="text"
        name="documento"
        class="form-control mb-2"
        placeholder="Documento">

    <input
        type="text"
        name="telefono"
        class="form-control mb-2"
        placeholder="Teléfono">

    <button class="btn btn-success">
      💾 Guardar
    </button>

</form>

<hr>

<table class="table table-striped table-hover table-bordered">

<tr>
    <th>ID</th>
    <th>Nombre</th>
    <th>Documento</th>
    <th>Teléfono</th>
    <th>Acciones</th>
</tr>

{% for c in clientes %}
<tr>

    <td>{{ c[0] }}</td>
    <td>{{ c[1] }}</td>
    <td>{{ c[2] }}</td>
    <td>{{ c[3] }}</td>

    <td>

        <a href="/editar_cliente/{{ c[0] }}"
           class="btn btn-warning btn-sm">
           Editar
        </a>

        <a href="/eliminar_cliente/{{ c[0] }}"
           class="btn btn-danger btn-sm"
           onclick="return confirm('¿Desea eliminar este cliente?')">
           Eliminar
        </a>

    </td>

</tr>
{% endfor %}

</table>

{% endblock %}
